services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: rag-phoenix
    restart: always
    ports:
      - "6006:6006" # UI Dashboard
      - "4317:4317" # gRPC OTLP collector
      - "4318:4318" # HTTP OTLP collector
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0

volumes:
  postgres_data:
